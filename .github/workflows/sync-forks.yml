name: Centralized sync forks

on:
  schedule:
    - cron: "0 2 * * 1" # еженедельно по понедельникам 02:00 UTC
  workflow_dispatch:

concurrency:
  group: centralized-sync-forks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dependencies
        run: |
          gh --version
          git --version
          jq --version

      - name: Run centralized sync
        env:
          MAINTAINER_TOKEN: ${{ secrets.MAINTAINER_TOKEN }}
        run: |
          chmod +x ./sync-forks.sh
          ./sync-forks.sh --user art-over-group --parallel 4
